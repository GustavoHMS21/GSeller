# Infraestrutura local de desenvolvimento.
# Uso: docker compose up -d
#
# A porta é publicada apenas em 127.0.0.1 para não expor o banco na rede local.
# As credenciais abaixo são exclusivas do ambiente local e não valem em nenhum outro ambiente.

services:
  postgres:
    image: postgres:17-alpine
    container_name: seller-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_local_only
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:5440:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
