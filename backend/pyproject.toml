[project]
name = "seller-backend"
version = "0.1.0"
description = "API de Financial Intelligence para sellers de marketplace"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.14",
    "asyncpg>=0.30",
    "cryptography>=43",
    "fastapi>=0.115",
    "httpx>=0.28",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.uv]
# Aplicação, não biblioteca: não empacotar, apenas gerenciar o ambiente.
package = false

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
# E/F: erros básicos | I: imports | B: bugs comuns | S: segurança (bandit) | UP: sintaxe moderna
select = ["E", "F", "I", "B", "S", "UP", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
# assert é o idioma do pytest; senhas fixas nos testes são fixtures locais.
"tests/**" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "db: teste que exige PostgreSQL disponível (DATABASE_URL)",
]
