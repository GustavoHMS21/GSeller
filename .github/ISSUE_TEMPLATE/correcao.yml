name: Correção
description: Algo funciona diferente do especificado
title: "fix: "
labels: ["bug"]
body:
  - type: textarea
    id: comportamento
    attributes:
      label: Comportamento atual
      description: O que acontece. Não inclua tokens, senhas ou dados pessoais.
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Comportamento esperado
    validations:
      required: true
  - type: textarea
    id: reproducao
    attributes:
      label: Como reproduzir
      placeholder: "1. ...\n2. ..."
    validations:
      required: true
  - type: input
    id: request_id
    attributes:
      label: request_id (se houver)
      description: Aparece nas respostas de erro da API e no header X-Request-ID.
  - type: dropdown
    id: prioridade
    attributes:
      label: Prioridade
      options: ["P0", "P1", "P2"]
    validations:
      required: true
