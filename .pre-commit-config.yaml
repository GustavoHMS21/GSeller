# Verificações locais antes de cada commit (opcional, recomendado).
# Instalação única (também ativa a validação da mensagem do commit): uvx pre-commit install
default_install_hook_types: [pre-commit, commit-msg]
# Hooks sem 'stages' rodam só antes do commit; a mensagem é validada apenas pelo commitlint.
default_stages: [pre-commit]

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.28.0
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
        exclude: \.md$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.13.0
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  # Frontend: Biome (lint + formatação). Roda dentro de frontend/, onde fica o biome.json.
  - repo: local
    hooks:
      - id: biome
        name: biome (frontend)
        language: system
        files: ^frontend/.*\.(ts|tsx|js|jsx|mjs|json|css)$
        entry: bash -c 'cd frontend && npx --no-install biome check --write --no-errors-on-unmatched --files-ignore-unknown=true "${@#frontend/}"' --

  # Mensagem do commit: Conventional Commits (Bloco 23), mesma configuração do CI.
  - repo: local
    hooks:
      # Usa o Node do sistema (já exigido pelo frontend); o ambiente Node isolado do
      # pre-commit não funciona no Windows. Versões fixadas iguais às do CI.
      - id: commitlint
        name: commitlint (mensagem do commit)
        language: system
        stages: [commit-msg]
        entry: npx --yes -p @commitlint/cli@21.2.3 -p @commitlint/config-conventional@21.2.3 commitlint --edit
